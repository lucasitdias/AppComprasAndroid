[versions]

# Versão do Android Gradle Plugin (AGP)
agp = "9.1.0"

# Versão da biblioteca JUnit (testes unitários)
junit = "4.13.2"

# Versão do JUnit para testes Android (extensão)
junitVersion = "1.2.1"

# Versão da biblioteca Espresso (testes de interface)
espressoCore = "3.6.1"

# Versão da biblioteca AppCompat (compatibilidade Android)
appcompat = "1.7.0"

# Versão da biblioteca Material Design
material = "1.12.0"

# Versão da biblioteca Activity (gerenciamento de telas)
activity = "1.9.3"

# Versão da biblioteca ConstraintLayout (layouts flexíveis)
constraintlayout = "2.1.4"


[libraries]

# Biblioteca principal de testes unitários (JUnit)
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Biblioteca de testes Android com JUnit estendido
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }

# Biblioteca Espresso para testes de interface
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Biblioteca AppCompat para suporte a versões antigas do Android
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Biblioteca de componentes Material Design
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Biblioteca para gerenciamento de Activities
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }

# Biblioteca ConstraintLayout para criação de layouts responsivos
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }


[plugins]

# Plugin principal para aplicações Android
android-application = { id = "com.android.application", version.ref = "agp" }
