# Configurações globais do Gradle (aplicadas em todo o projeto)

# Usuários de IDE (ex: Android Studio):
# Configurações feitas pela IDE podem sobrescrever este arquivo

# Link para documentação sobre configuração do ambiente de build
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Define os argumentos da JVM utilizados pelo processo do Gradle (daemon)
# Útil para ajustar memória e desempenho
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Habilita execução paralela de tarefas do Gradle
org.gradle.parallel=true

# Habilita cache de build para melhorar performance
org.gradle.caching=true

# Habilita cache de configuração (reduz tempo de build)
org.gradle.configuration-cache=true

# Desativa o Jetifier (usado para migrar bibliotecas antigas para AndroidX)
android.enableJetifier=false

# Ativa o uso de bibliotecas AndroidX no projeto
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Quando habilitado, o Gradle executa em modo paralelo (experimental/incubado)
# Deve ser usado apenas com projetos desacoplados
# Para mais detalhes:
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects

# org.gradle.parallel=true